name: Daily stock analysis

on:
  schedule:
    # Indian market hours (IST = UTC+5:30), Mon-Fri:
    # every hour from ~09:45 to ~15:45 IST, plus a final run after close (16:15 IST).
    - cron: "15 4-10 * * 1-5"
    - cron: "45 10 * * 1-5"
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["config.json", "analyzer/**", "run.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-analysis
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run analysis
        run: python run.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/data.js
          git diff --cached --quiet || git commit -m "Update market analysis $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin ${{ github.ref_name }} && git push
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true   # first run: enable Pages (Settings → Pages → Source: GitHub Actions)
